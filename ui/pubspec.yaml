name: waaiya_ui
description: Waaiya's shared screens, used by the Android app (ui_module) and the desktop apps (desktop).
version: 0.2.2
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

# No plugins: everything system-level goes through the backend (docs/UI_CONTRACT.md).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
