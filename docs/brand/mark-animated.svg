<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" color="#fff" class="wy wy-anim" role="img"><title>واعية</title><style>.wy .wy-dot,.wy .wy-kept{transform-box:fill-box;transform-origin:50% 50%} .wy .wy-wave{opacity:0} .wy-anim .wy-stroke{stroke-dasharray:1 1;animation:wy-draw .9s calc(var(--n,0)*.12s) cubic-bezier(.6,0,.3,1) both} .wy-anim .wy-dot{animation:wy-pop .35s calc(1s + var(--n,0)*.07s) cubic-bezier(.3,1.6,.5,1) both} .wy-anim .wy-wave{animation:wy-arrive 4.4s calc(.9s + (2 - var(--i,0))*.2s) cubic-bezier(.4,0,.2,1) infinite} .wy-anim .wy-inner{animation:wy-draw .7s 1.9s cubic-bezier(.6,0,.3,1) both} .wy-anim .wy-kept{animation:wy-keep 4.4s 2.7s ease-in-out infinite} @keyframes wy-draw{0%{stroke-dashoffset:1;opacity:0}4%{opacity:1}100%{stroke-dashoffset:0;opacity:1}} @keyframes wy-pop{from{transform:scale(0)}to{transform:scale(1)}} @keyframes wy-arrive{0%{opacity:0;transform:translateX(9px)}14%{opacity:.9}30%{opacity:.5;transform:translateX(1px)}40%,100%{opacity:0;transform:translateX(0)}} @keyframes wy-keep{0%,100%{transform:scale(1);opacity:1}10%{transform:scale(1.12);opacity:1}26%{transform:scale(.97);opacity:.7}44%{transform:scale(1);opacity:1}} @media (prefers-reduced-motion:reduce){.wy-anim .wy-stroke,.wy-anim .wy-dot,.wy-anim .wy-wave,.wy-anim .wy-inner,.wy-anim .wy-kept{animation:none}}</style><rect class="wy-ground" width="120" height="120" rx="26" fill="#0D6B5E"/><g transform="translate(13.2 13.2) scale(0.78)"><g class="wy-waves" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" ><path class="wy-wave" style="--i:0" d="M95.52 46.35 A59 59 0 0 1 95.52 17.81"/><path class="wy-wave" style="--i:1" d="M108.07 46.6 A47 47 0 0 1 108.07 17.56"/><path class="wy-wave" style="--i:2" d="M120.32 45.19 A35 35 0 0 1 120.32 18.97"/></g><g class="wy-letter" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" ><path class="wy-stroke" pathLength="1" d="M80.2 22.15 A14.5 14.5 0 1 0 74.67 44.33 A31 31 0 1 0 89.43 86.01"/></g><g class="wy-kept" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" ><path class="wy-stroke wy-inner" pathLength="1" d="M66.01 60.2 A13 13 0 1 0 66.01 84.64"/></g></g></svg>
