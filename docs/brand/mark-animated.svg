<svg xmlns="http://www.w3.org/2000/svg" class="wy wy-anim" color="#fff" role="img" viewBox="0 0 120 120"><title>واعية</title><style>@keyframes wy-draw{0%{stroke-dashoffset:1;opacity:0}4%{opacity:1}}@keyframes wy-arrive{0%{opacity:0;transform:translateX(9px)}14%{opacity:.9}30%{opacity:.5;transform:translateX(1px)}40%{opacity:0;transform:translateX(0)}}@keyframes wy-keep{0%,44%{transform:scale(1);opacity:1}10%{transform:scale(1.12);opacity:1}26%{transform:scale(.97);opacity:.7}}.wy .wy-kept{transform-box:fill-box;transform-origin:50% 50%}.wy .wy-wave{opacity:0}.wy-anim .wy-stroke{stroke-dasharray:1 1;animation:wy-draw .9s calc(var(--n,0)*.12s) cubic-bezier(.6,0,.3,1) both}.wy-anim .wy-wave{animation:wy-arrive 4.4s calc(.9s + (2 - var(--i,0))*.2s) cubic-bezier(.4,0,.2,1) infinite}.wy-anim .wy-inner{animation:wy-draw .7s 1.9s cubic-bezier(.6,0,.3,1) both}.wy-anim .wy-kept{animation:wy-keep 4.4s 2.7s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.wy-anim .wy-inner,.wy-anim .wy-kept,.wy-anim .wy-stroke,.wy-anim .wy-wave{animation:none}}</style><rect width="120" height="120" fill="#0D6B5E" class="wy-ground" rx="26"/><g><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="6" class="wy-waves"><path class="wy-wave" style="--i:0" d="M95.52 46.35 A59 59 0 0 1 95.52 17.81" transform="translate(13.2 13.2) scale(0.78)"/><path class="wy-wave" style="--i:1" d="M108.07 46.6 A47 47 0 0 1 108.07 17.56" transform="translate(13.2 13.2) scale(0.78)"/><path class="wy-wave" style="--i:2" d="M120.32 45.19 A35 35 0 0 1 120.32 18.97" transform="translate(13.2 13.2) scale(0.78)"/></g><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="12" class="wy-letter"><path d="M80.2 22.15 A14.5 14.5 0 1 0 74.67 44.33 A31 31 0 1 0 89.43 86.01" class="wy-stroke" pathLength="1" transform="translate(13.2 13.2) scale(0.78)"/></g><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="8" class="wy-kept"><path d="M66.01 60.2 A13 13 0 1 0 66.01 84.64" class="wy-stroke wy-inner" pathLength="1" transform="translate(13.2 13.2) scale(0.78)"/></g></g></svg>