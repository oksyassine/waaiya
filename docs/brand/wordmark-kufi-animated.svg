<svg xmlns="http://www.w3.org/2000/svg" viewBox="93 41 244 144" class="wy wy-anim" role="img"><title>واعية</title><style>.wy .wy-dot,.wy .wy-kept{transform-box:fill-box;transform-origin:50% 50%} .wy .wy-wave{opacity:0} .wy-anim .wy-stroke{stroke-dasharray:1 1;animation:wy-draw .9s calc(var(--n,0)*.12s) cubic-bezier(.6,0,.3,1) both} .wy-anim .wy-dot{animation:wy-pop .35s calc(1s + var(--n,0)*.07s) cubic-bezier(.3,1.6,.5,1) both} .wy-anim .wy-wave{animation:wy-arrive 4.4s calc(.9s + (2 - var(--i,0))*.2s) cubic-bezier(.4,0,.2,1) infinite} .wy-anim .wy-inner{animation:wy-draw .7s 1.9s cubic-bezier(.6,0,.3,1) both} .wy-anim .wy-kept{animation:wy-keep 4.4s 2.7s ease-in-out infinite} @keyframes wy-draw{0%{stroke-dashoffset:1;opacity:0}4%{opacity:1}100%{stroke-dashoffset:0;opacity:1}} @keyframes wy-pop{from{transform:scale(0)}to{transform:scale(1)}} @keyframes wy-arrive{0%{opacity:0;transform:translateX(9px)}14%{opacity:.9}30%{opacity:.5;transform:translateX(1px)}40%,100%{opacity:0;transform:translateX(0)}} @keyframes wy-keep{0%,100%{transform:scale(1);opacity:1}10%{transform:scale(1.12);opacity:1}26%{transform:scale(.97);opacity:.7}44%{transform:scale(1);opacity:1}} @media (prefers-reduced-motion:reduce){.wy-anim .wy-stroke,.wy-anim .wy-dot,.wy-anim .wy-wave,.wy-anim .wy-inner,.wy-anim .wy-kept{animation:none}}</style><rect x="93" y="41" width="244" height="144" fill="#053D35"/><g class="wy-word" fill="none" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path class="wy-stroke wy-waw" style="--n:0" pathLength="1" stroke="#fff" d="M316 124 A16 16 0 1 1 284 124 A16 16 0 1 1 316 124"/><path class="wy-stroke wy-waw" style="--n:1" pathLength="1" stroke="#fff" d="M316 124 V128 A34 34 0 0 1 282 164"/><path class="wy-stroke wy-alif" style="--n:2" pathLength="1" stroke="#fff" d="M258 140 V62"/><path class="wy-stroke wy-ain" style="--n:3" pathLength="1" stroke="#fff" d="M231.12 108.29 A19 19 0 1 0 217 140"/><path class="wy-stroke wy-line" style="--n:4" pathLength="1" stroke="#fff" d="M236 140 H130"/><path class="wy-stroke wy-ya" style="--n:5" pathLength="1" stroke="#fff" d="M172 140 V116"/><path class="wy-stroke wy-ta" style="--n:6" pathLength="1" stroke="#fff" d="M146 124 A16 16 0 1 1 114 124 A16 16 0 1 1 146 124"/></g><circle class="wy-dot" style="--n:0" cx="181.5" cy="163" r="6.5" fill="#fff"/><circle class="wy-dot" style="--n:1" cx="162.5" cy="163" r="6.5" fill="#fff"/><circle class="wy-dot" style="--n:2" cx="139.5" cy="87" r="6.5" fill="#fff"/><circle class="wy-dot" style="--n:3" cx="120.5" cy="87" r="6.5" fill="#fff"/></svg>
