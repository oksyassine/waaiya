name: Linux engine

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ONNX Runtime and the models (checksummed)
        run: scripts/fetch_deps.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build engine, CLI, LADSPA plugin and im-pulse
        run: make -j"$(nproc)" all build/test-detector build/test-mono build/test-failclosed
      - name: Engine test, mono switch on a running engine (slow phones)
        run: build/test-mono models/dfn3/dfn3_stream_int8.onnx
      - name: Engine test, fail-closed (no model = exact silence; no detector + FAIL_CLOSED = voice muted)
        run: build/test-failclosed models/dfn3/dfn3_stream_int8.onnx
      - name: Women's-singing detector test (only when models/detector/detector_v1.onnx exists)
        run: |
          m=models/detector/detector_v1.onnx
          if [ ! -f "$m" ]; then
            echo "::notice::Detector test skipped, not passed: $m is in no release yet (scripts/fetch_deps.sh detector), so CI has no detector to run"
            exit 0
          fi
          python3 - "$RUNNER_TEMP/det.wav" <<'PY'
          import math, random, struct, sys, wave
          sr = 48000
          with wave.open(sys.argv[1], "wb") as w:  # mono 48 kHz, 6 s of a voiced sound
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
              frames = bytearray()
              for n in range(sr * 6):
                  t = n / sr
                  f0 = 220 + 30 * math.sin(2 * math.pi * 0.5 * t)
                  s = sum(math.sin(2 * math.pi * f0 * h * t) / h for h in range(1, 9))
                  s = 0.15 * (0.6 + 0.4 * math.sin(2 * math.pi * 4 * t)) * s + 0.01 * (random.random() - 0.5)
                  frames += struct.pack("<h", int(max(-1, min(1, s)) * 32767))
              w.writeframes(bytes(frames))
          PY
          out="$(build/test-detector "$m" "$RUNNER_TEMP/det.wav" "$RUNNER_TEMP/det_power.bin")"
          echo "$out"
          # test-detector exits 0 even if no window ran or a run failed: check its counts and the power window size
          echo "$out" | grep -Eq '^runs=[1-9][0-9]* fails=0 ' || { echo "::error::detector did not run cleanly"; exit 1; }
          [ "$(stat -c %s "$RUNNER_TEMP/det_power.bin")" = $((769 * 100 * 4)) ] || { echo "::error::wrong power window size"; exit 1; }
      - name: Smoke test, filter a generated file through the C engine
        run: |
          python3 - <<'PY'
          import math, random, struct, wave
          sr = 48000
          with wave.open("in.wav", "wb") as w:
              w.setnchannels(2); w.setsampwidth(2); w.setframerate(sr)
              frames = bytearray()
              for n in range(sr * 3):
                  s = 0.3 * math.sin(2 * math.pi * 440 * n / sr) + 0.05 * (random.random() - 0.5)
                  frames += struct.pack("<hh", int(s * 32767), int(s * 32767))
              w.writeframes(bytes(frames))
          PY
          build/im-process -m models/dfn3/dfn3_stream_int8.onnx in.wav out.wav
          python3 - <<'PY'
          import struct
          def frames(path):  # RIFF reader that also takes float WAV (format 3), which the wave module refuses
              d = open(path, "rb").read(); i = 12; ch = bits = None
              while i < len(d):
                  cid, size = d[i:i + 4], struct.unpack("<I", d[i + 4:i + 8])[0]
                  if cid == b"fmt ":
                      ch, bits = struct.unpack("<H", d[i + 10:i + 12])[0], struct.unpack("<H", d[i + 22:i + 24])[0]
                  if cid == b"data":
                      return size // (ch * bits // 8), ch
                  i += 8 + size + (size & 1)
          (a, _), (b, ch) = frames("in.wav"), frames("out.wav")
          assert a == b, (a, b)
          print("ok:", b, "frames,", ch, "channels")
          PY
      - name: Screen blur tracker tests (C, synthetic frames; no models needed)
        run: |
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install --quiet numpy
          /tmp/venv/bin/python models/vision/test_cover.py
      - name: Link updater tests (im_update.py, standard library only, no network)
        run: python3 android/app/src/test/python/test_im_update.py
      - name: Shell scripts parse
        run: for f in linux/bin/islamic-mute linux/*.sh scripts/*.sh; do bash -n "$f"; done
