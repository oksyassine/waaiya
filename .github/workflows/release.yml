name: Release

# Push a tag like v0.2.0 to build release files and attach them to a draft GitHub release.
# The APK is signed only if the repository has these secrets (otherwise an unsigned APK is attached and must be
# signed by the maintainer before anyone can install it):
#   ANDROID_KEYSTORE_B64 (base64 of the .jks), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ONNX Runtime and the models (checksummed)
        run: scripts/fetch_deps.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - run: make -j"$(nproc)" all build/test-mono build/test-failclosed build/test-detector
      - name: Engine tests (C) before packaging
        run: |
          build/test-mono models/dfn3/dfn3_stream_int8.onnx
          build/test-failclosed models/dfn3/dfn3_stream_int8.onnx
          m=models/detector/detector_v1.onnx
          if [ ! -f "$m" ]; then
            echo "::notice::Detector test skipped, not passed: $m is in no release yet (scripts/fetch_deps.sh detector)"
          else
            python3 - "$RUNNER_TEMP/det.wav" <<'PY'
          import math, struct, sys, wave
          sr = 48000
          with wave.open(sys.argv[1], "wb") as w:  # mono 48 kHz, 6 s of a voiced sound
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
              w.writeframes(b"".join(struct.pack("<h", int(32767 * 0.15 * sum(
                  math.sin(2 * math.pi * 220 * h * n / sr) / h for h in range(1, 9)))) for n in range(sr * 6)))
          PY
            out="$(build/test-detector "$m" "$RUNNER_TEMP/det.wav" "$RUNNER_TEMP/det_power.bin")"
            echo "$out"
            # test-detector exits 0 even if no window ran or a run failed: check its counts
            echo "$out" | grep -Eq '^runs=[1-9][0-9]* fails=0 ' || { echo "::error::detector did not run cleanly"; exit 1; }
          fi
      - name: Package
        run: |
          d="waaiya-linux-x64-${GITHUB_REF_NAME}"
          mkdir -p "$d/build" "$d/models/dfn3" "$d/linux"
          cp -P build/im-* build/*.so* "$d/build/"
          cp models/dfn3/dfn3_stream_int8.* "$d/models/dfn3/"
          cp -r linux/bin linux/systemd linux/pipewire "$d/linux/"
          cp LICENSE NOTICE THIRD_PARTY_LICENSES.md third_party/onnxruntime/ThirdPartyNotices.txt "$d/"
          tar czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: "waaiya-linux-x64-*.tar.gz" }

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with: { cache-read-only: true }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: "3.41.5", cache: true }
      - name: Flutter module (main screen; creates ui_module/.android)
        working-directory: ui_module
        run: flutter pub get
      - name: Fetch the voice and screen-blur models and the ONNX Runtime licence texts (checksummed)
        run: scripts/fetch_deps.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Signing config (only when the secrets exist)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            d="$RUNNER_TEMP/signing"; mkdir -p "$d"
            echo "$KS" | base64 -d > "$d/release.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$d/release.jks" "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > "$d/keystore.properties"
            echo "SIGNING=-PimSigning=$d/keystore.properties" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets: the APK will be unsigned."
          fi
      - name: JVM unit tests (release variant)
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest -PimAbiSplit -PimBuildPython="$(which python3.11)"
      - name: Build release APKs (per ABI + universal)
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease -PimAbiSplit -PimBuildPython="$(which python3.11)" ${SIGNING:-}
      - name: Collect
        run: |
          mkdir out
          for f in android/app/build/outputs/apk/release/*.apk; do
            cp "$f" "out/waaiya-${GITHUB_REF_NAME}-$(basename "$f" | sed 's/^app-//')"
          done
          rm -rf "$RUNNER_TEMP/signing"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/*.apk }

  # Windows desktop app (sound filter + screen blur): programs cross-compiled with llvm-mingw, then the Flutter app
  # built and bundled on Windows (as windows.yml, which also tests them on Windows runners)
  windows-programs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch llvm-mingw, ONNX Runtime for Windows and the models (checksummed)
        run: |
          scripts/fetch_deps.sh mingw
          scripts/fetch_deps.sh ort-win
          scripts/fetch_deps.sh models
          scripts/fetch_deps.sh vision
          scripts/fetch_deps.sh detector
        env:
          GH_TOKEN: ${{ github.token }}
      - run: make -j"$(nproc)" -f windows/Makefile CROSS="$PWD/third_party/llvm-mingw/bin/x86_64-w64-mingw32-" ORT=third_party/onnxruntime-win
      - name: Models next to the programs
        run: |
          mkdir -p build-win/models/dfn3 build-win/models/vision
          cp models/dfn3/dfn3_stream_int8.* build-win/models/dfn3/
          cp models/vision/*.onnx build-win/models/vision/
          if [ -f models/detector/detector_v1.onnx ]; then
            mkdir -p build-win/models/detector && cp models/detector/detector_v1.onnx build-win/models/detector/
          fi
      - uses: actions/upload-artifact@v4
        with: { name: windows-programs, path: build-win }

  windows-desktop:
    needs: windows-programs
    runs-on: windows-latest
    timeout-minutes: 300 # the signing request waits for a person to approve it in SignPath
    permissions:
      contents: read
      actions: read # SignPath's action reads the uploaded artifact
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: "3.41.5", cache: true }
      - uses: actions/download-artifact@v4
        with: { name: windows-programs, path: build-win }
      - name: ONNX Runtime licence texts (checksummed)
        shell: bash
        run: scripts/fetch_deps.sh ort-win
      - name: Build
        working-directory: desktop
        run: flutter build windows --release
      - name: Filter, blur, models and licence texts into the app
        shell: bash
        run: |
          bash desktop/tool/bundle_windows.sh desktop/build/windows/x64/runner/Release build-win
          echo "WAAIYA_VERSION=$(sed -n 's/^version: *//p' desktop/pubspec.yaml | tr -d '\r')" >> "$GITHUB_ENV"
      # Code signing (docs: README "Code signing policy"): SignPath signs waaiya_desktop.exe, waaiya-filter.exe and
      # waaiya-blur.exe (.signpath/artifact-configuration.xml) once an approver approves the request in SignPath.
      # Skipped, and the app shipped unsigned, until the repository has the variables SIGNPATH_ORGANIZATION_ID,
      # SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG and the secret SIGNPATH_API_TOKEN.
      - name: The unsigned app, as SignPath receives it
        id: unsigned
        uses: actions/upload-artifact@v4
        with: { name: windows-desktop-unsigned, path: desktop/build/windows/x64/runner/Release }
      - name: Sign (SignPath; waits for the approval in SignPath)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signed
          parameters: |
            version: ${{ toJSON(env.WAAIYA_VERSION) }}
      - name: The signed programs replace the unsigned ones; signatures checked
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          $app = "desktop/build/windows/x64/runner/Release"
          Copy-Item -Recurse -Force signed/* $app/
          foreach ($f in "waaiya_desktop.exe", "engine/waaiya-filter.exe", "engine/waaiya-blur.exe") {
            $s = Get-AuthenticodeSignature (Join-Path $app $f)
            Write-Host "$f : $($s.Status) $($s.SignerCertificate.Subject)"
            if ($s.Status -ne "Valid") { throw "$f is not validly signed ($($s.Status))" }
          }
      - name: Package
        shell: pwsh
        run: |
          Rename-Item desktop/build/windows/x64/runner/Release waaiya
          Compress-Archive -Path desktop/build/windows/x64/runner/waaiya -DestinationPath "waaiya-desktop-windows-x64-$env:GITHUB_REF_NAME.zip"
      - uses: actions/upload-artifact@v4
        with: { name: windows-desktop, path: "waaiya-desktop-windows-x64-*.zip" }

  # Linux desktop app: built on 22.04 (GLib 2.72) like flutter.yml, so it starts on older systems
  linux-desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: "3.41.5", cache: true }
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Engines and models (checksummed)
        run: scripts/fetch_deps.sh && make -j"$(nproc)" all
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build
        working-directory: desktop
        run: flutter build linux --release
      - name: Engine and licence texts into the bundle
        run: bash desktop/tool/bundle_engine.sh desktop/build/linux/x64/release/bundle
      - name: Package
        run: tar czf "waaiya-desktop-linux-x64-${GITHUB_REF_NAME}.tar.gz" -C desktop/build/linux/x64/release --transform 's,^bundle,waaiya,' bundle
      - uses: actions/upload-artifact@v4
        with: { name: linux-desktop, path: "waaiya-desktop-linux-x64-*.tar.gz" }

  publish:
    needs: [linux, android, windows-desktop, linux-desktop]
    runs-on: ubuntu-24.04
    steps:
      # only the release files (not the intermediate windows-programs artifact)
      - uses: actions/download-artifact@v4
        with: { name: linux, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: android, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: windows-desktop, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: linux-desktop, path: dist }
      - run: cd dist && ls -la && sha256sum * > SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "Waaiya $GITHUB_REF_NAME" \
            --notes "Windows: what the app changes and how to remove it, and the **Code signing policy**: https://github.com/$GITHUB_REPOSITORY#code-signing-policy"
