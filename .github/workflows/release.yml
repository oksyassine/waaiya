name: Release

# Push a tag like v0.2.0 to build release files and attach them to a draft GitHub release.
# The APK is signed only if the repository has these secrets (otherwise an unsigned APK is attached and must be
# signed by the maintainer before anyone can install it):
#   ANDROID_KEYSTORE_B64 (base64 of the .jks), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ONNX Runtime and the models (checksummed)
        run: scripts/fetch_deps.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - run: make -j"$(nproc)" all build/test-mono build/test-failclosed build/test-detector
      - name: Engine tests (C) before packaging
        run: |
          build/test-mono models/dfn3/dfn3_stream_int8.onnx
          build/test-failclosed models/dfn3/dfn3_stream_int8.onnx
          m=models/detector/detector_v1.onnx
          if [ ! -f "$m" ]; then
            echo "::notice::Detector test skipped, not passed: $m is in no release yet (scripts/fetch_deps.sh detector)"
          else
            python3 - "$RUNNER_TEMP/det.wav" <<'PY'
          import math, struct, sys, wave
          sr = 48000
          with wave.open(sys.argv[1], "wb") as w:  # mono 48 kHz, 6 s of a voiced sound
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
              w.writeframes(b"".join(struct.pack("<h", int(32767 * 0.15 * sum(
                  math.sin(2 * math.pi * 220 * h * n / sr) / h for h in range(1, 9)))) for n in range(sr * 6)))
          PY
            out="$(build/test-detector "$m" "$RUNNER_TEMP/det.wav" "$RUNNER_TEMP/det_power.bin")"
            echo "$out"
            # test-detector exits 0 even if no window ran or a run failed: check its counts
            echo "$out" | grep -Eq '^runs=[1-9][0-9]* fails=0 ' || { echo "::error::detector did not run cleanly"; exit 1; }
          fi
      - name: Package
        run: |
          d="waaiya-linux-x64-${GITHUB_REF_NAME}"
          mkdir -p "$d/build" "$d/models/dfn3" "$d/linux"
          cp -P build/im-* build/*.so* "$d/build/"
          cp models/dfn3/dfn3_stream_int8.* "$d/models/dfn3/"
          cp -r linux/bin linux/systemd linux/pipewire "$d/linux/"
          cp LICENSE NOTICE THIRD_PARTY_LICENSES.md third_party/onnxruntime/ThirdPartyNotices.txt "$d/"
          tar czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: "waaiya-linux-x64-*.tar.gz" }

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with: { cache-read-only: true }
      - name: Fetch the voice and screen-blur models and the ONNX Runtime licence texts (checksummed)
        run: scripts/fetch_deps.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Signing config (only when the secrets exist)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            d="$RUNNER_TEMP/signing"; mkdir -p "$d"
            echo "$KS" | base64 -d > "$d/release.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$d/release.jks" "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > "$d/keystore.properties"
            echo "SIGNING=-PimSigning=$d/keystore.properties" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets: the APK will be unsigned."
          fi
      - name: JVM unit tests (release variant)
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest -PimAbiSplit -PimBuildPython="$(which python3.11)"
      - name: Build release APKs (per ABI + universal)
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease -PimAbiSplit -PimBuildPython="$(which python3.11)" ${SIGNING:-}
      - name: Collect
        run: |
          mkdir out
          for f in android/app/build/outputs/apk/release/*.apk; do
            cp "$f" "out/waaiya-${GITHUB_REF_NAME}-$(basename "$f" | sed 's/^app-//')"
          done
          rm -rf "$RUNNER_TEMP/signing"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/*.apk }

  publish:
    needs: [linux, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum * > SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "Waaiya $GITHUB_REF_NAME"
