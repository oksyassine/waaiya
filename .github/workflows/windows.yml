name: Windows

# The Windows sound filter and screen blur: cross-compiled on Linux (llvm-mingw, windows/Makefile), then run on real
# Windows runners: engine tests, and the filter end to end on the Windows audio stack with a virtual output
# (windows/test/audio_test.py). Real speakers, Bluetooth and DRM players need a PC (docs/PLATFORMS.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.5" # as flutter.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: third_party/llvm-mingw
          key: llvm-mingw-${{ hashFiles('scripts/fetch_deps.sh') }}
      - uses: actions/cache@v4
        with:
          path: third_party/ffmpeg-win
          key: ffmpeg-win-${{ hashFiles('scripts/build_ffmpeg_win.sh') }}
      - name: Fetch llvm-mingw, ONNX Runtime for Windows and the models (checksummed)
        run: |
          scripts/fetch_deps.sh mingw
          scripts/fetch_deps.sh ort-win
          scripts/fetch_deps.sh models
          scripts/fetch_deps.sh vision
          scripts/fetch_deps.sh detector
          # the women's-singing model is in the models-v1 release since 0.2.12: the Windows app must have it
          [ -f models/detector/detector_v1.onnx ] || { echo "::error::women's-singing model not fetched"; exit 1; }
          # Links ("save without music"): yt-dlp and QuickJS-ng, pinned and checksummed
          scripts/fetch_deps.sh links-win
        env:
          GH_TOKEN: ${{ github.token }}
      - name: A small LGPL ffmpeg for Links (cached; pinned source tarball)
        run: scripts/build_ffmpeg_win.sh
      - name: Build
        run: make -j"$(nproc)" -f windows/Makefile CROSS="$PWD/third_party/llvm-mingw/bin/x86_64-w64-mingw32-" ORT=third_party/onnxruntime-win
      - name: Models next to the programs
        run: |
          mkdir -p build-win/models/dfn3 build-win/models/vision
          cp models/dfn3/dfn3_stream_int8.* build-win/models/dfn3/
          cp models/vision/*.onnx build-win/models/vision/
          mkdir -p build-win/models/detector && cp models/detector/detector_v1.onnx build-win/models/detector/
          mkdir -p build-win/links
          cp third_party/links-win/yt-dlp.exe third_party/links-win/qjs.exe third_party/links-win/*.txt build-win/links/
          cp third_party/ffmpeg-win/ffmpeg.exe third_party/ffmpeg-win/*.txt build-win/links/
      - uses: actions/upload-artifact@v4
        with:
          name: waaiya-windows-x64-programs
          path: build-win
          retention-days: 7

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: windows/test
      - uses: actions/download-artifact@v4
        with:
          name: waaiya-windows-x64-programs
          path: build-win
      - name: Engine tests (mono switch, fail-closed) on Windows
        shell: bash
        run: |
          build-win/test-mono.exe build-win/models/dfn3/dfn3_stream_int8.onnx
          build-win/test-failclosed.exe build-win/models/dfn3/dfn3_stream_int8.onnx
          # the women's-singing detector through ONNX Runtime on Windows (6 s of a voiced sound)
          python - det.wav <<'PY'
          import math, struct, sys, wave
          sr = 48000
          with wave.open(sys.argv[1], "wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
              w.writeframes(b"".join(struct.pack("<h", int(32767 * 0.15 * sum(
                  math.sin(2 * math.pi * 220 * h * n / sr) / h for h in range(1, 9)))) for n in range(sr * 6)))
          PY
          out="$(build-win/test-detector.exe build-win/models/detector/detector_v1.onnx det.wav det_power.bin)"
          echo "$out"
          echo "$out" | grep -Eq '^runs=[1-9][0-9]* fails=0 ' || { echo "::error::detector did not run cleanly"; exit 1; }
      - name: An audio output for the runner (Scream virtual driver)
        shell: pwsh
        run: windows/test/audio_device.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet numpy
      - name: Sound filter end to end (route C2, bypass, filtering, new apps, crash, stop, restore)
        run: python windows/test/audio_test.py build-win
      - name: Screen blur end to end (self-test, covers, click-through, fail-closed, models, GDI)
        if: success() || failure()
        run: python windows/test/blur_test.py build-win
      - name: Filter state and log
        if: always()
        shell: bash
        run: |
          cat "$LOCALAPPDATA/Waaiya/filter/state.json" 2>/dev/null || true
          for f in "$TEMP"/waaiya-audio-*/filter/filter.log; do echo "== $f"; tail -n 60 "$f"; done 2>/dev/null || true

  # The desktop app for Windows with the filter and the blur in it (desktop/tool/bundle_windows.sh), zipped.
  desktop:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: waaiya-windows-x64-programs
          path: build-win
      - name: ONNX Runtime licence texts (checksummed)
        shell: bash
        run: scripts/fetch_deps.sh ort-win
      - name: Build
        working-directory: desktop
        run: flutter build windows --release
      - name: Filter, blur, models and licence texts into the app
        shell: bash
        run: bash desktop/tool/bundle_windows.sh desktop/build/windows/x64/runner/Release build-win
        env:
          REQUIRE_LINKS: "1"
      - name: Links, saved without music with the real tools (a clip served from the runner; no YouTube)
        working-directory: desktop
        shell: bash
        run: |
          export WAAIYA_LINK_ENGINE="$(cygpath -w "$PWD/build/windows/x64/runner/Release/engine")"
          flutter test test/links_pipeline_test.dart
      - name: The app starts and finds its filter and blur (a few seconds, then closed)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath desktop/build/windows/x64/runner/Release/waaiya_desktop.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "the app exited at once (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
      - name: Package
        shell: pwsh
        run: |
          Rename-Item desktop/build/windows/x64/runner/Release waaiya
          Compress-Archive -Path desktop/build/windows/x64/runner/waaiya -DestinationPath waaiya-desktop-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: waaiya-desktop-windows-x64
          path: waaiya-desktop-windows-x64.zip
          retention-days: 14

  # The Microsoft Store package (desktop/tool/make_msix.ps1) of the app above: the unsigned .msix the Store takes,
  # and a test-signed copy installed and run here (windows/test/msix_test.py: install, the app starts, the filter
  # inside the package, the startup task, a Store update and an uninstall while filtering).
  msix:
    needs: [build, desktop]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: waaiya-desktop-windows-x64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: waaiya-windows-x64-programs
          path: build-win
      - name: Package (unsigned, for the Store) and a higher version (for the update test)
        shell: pwsh
        run: |
          Expand-Archive dist/waaiya-desktop-windows-x64.zip -DestinationPath app
          desktop/tool/make_msix.ps1 -App app/waaiya -Out waaiya-store.msix
          desktop/tool/make_msix.ps1 -App app/waaiya -Out waaiya-next.msix -Version 9.0.0.0
          # Links in the Store package: watch only (no save tools); the zip has them
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead("$PWD/waaiya-store.msix")
          $bad = $z.Entries | Where-Object { $_.FullName -match '^engine/(links/|im-process\.exe)' }
          $z.Dispose()
          if ($bad) { throw "the Store package has the save tools: $($bad.FullName -join ', ')" }
          if (-not (Test-Path app/waaiya/engine/links/yt-dlp.exe)) { throw "the zip has no save tools" }
      - name: Test certificate with the Store publisher's name, trusted by this runner; test copies signed
        shell: pwsh
        run: |
          $pub = "CN=C31050E3-9E33-47EF-9D5C-040742962A92"
          $cert = New-SelfSignedCertificate -Type Custom -Subject $pub -KeyUsage DigitalSignature `
            -FriendlyName "Waaiya CI test" -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pw = ConvertTo-SecureString -String "ci-test" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath test.pfx -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath test.cer | Out-Null
          Import-Certificate -FilePath test.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          foreach ($p in "waaiya-store", "waaiya-next") {
            Copy-Item "$p.msix" "$p-test.msix"
            & $signtool.FullName sign /fd SHA256 /f test.pfx /p ci-test "$p-test.msix"
            if ($LASTEXITCODE) { throw "signtool: exit $LASTEXITCODE" }
          }
      - name: An audio output for the runner (Scream virtual driver)
        shell: pwsh
        run: windows/test/audio_device.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet numpy
      - name: The package installed and run (filter, startup task, update, uninstall)
        run: python windows/test/msix_test.py build-win waaiya-store-test.msix waaiya-next-test.msix
      - name: Filter logs
        if: always()
        shell: bash
        run: |
          for f in "$LOCALAPPDATA"/Packages/Oks.Waaiya_*/LocalCache/Local/Waaiya/filter/filter.log \
                   "$LOCALAPPDATA"/Waaiya/filter/filter.log; do [ -f "$f" ] && { echo "== $f"; tail -n 60 "$f"; }; done
          true
      - uses: actions/upload-artifact@v4
        with:
          name: waaiya-store-msix
          path: waaiya-store.msix
          retention-days: 30
