name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Chaquopy needs the same Python minor version on the build machine as in the app (3.11).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: NDK and CMake
        # The runner image has the Android SDK (ANDROID_HOME); add the pinned NDK and CMake.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Default model and ONNX Runtime licence texts
        run: scripts/fetch_deps.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build debug APK (arm64-v8a, armeabi-v7a)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug -PimBuildPython="$(which python3.11)"
      - uses: actions/upload-artifact@v4
        with:
          name: waaiya-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          retention-days: 14
