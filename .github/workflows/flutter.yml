name: Flutter UI

# Shared screens (ui/), the Android add-to-app module (ui_module/) and the desktop app (desktop/).
# The Android APK itself is built by android.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.5"

jobs:
  analyze-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: ARB files match the Android strings
        run: python3 ui/tool/arb_from_android.py --check
      - name: Dependencies
        run: |
          for p in ui ui_module desktop; do (cd "$p" && flutter pub get); done
      - name: Generated localizations are committed and current
        working-directory: ui
        run: flutter gen-l10n && git diff --exit-code -- lib/l10n
      - name: Analyze
        run: |
          for p in ui ui_module desktop; do (cd "$p" && flutter analyze); done
      - name: Test
        run: |
          for p in ui desktop; do (cd "$p" && flutter test); done

  linux:
    runs-on: ubuntu-22.04  # GLib 2.72: a build on 24.04 needs GLib >= 2.80 (g_once_init_enter_pointer) to start
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Linux toolchain
        # xvfb, libxtst6: the screen-blur test on a real X server; sway, grim, python3-pil: the layer-shell overlay in
        # a headless wlroots compositor; the -dev packages only for the ABI check (the
        # blur helper loads X11 / PipeWire / Wayland at run time and builds without them)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb libxtst6 xcompmgr sway grim python3-pil \
            libx11-dev libxext-dev libxrandr-dev libxdamage-dev libpipewire-0.3-dev libspa-0.2-dev libwayland-dev
      - name: Engines (ONNX Runtime, voice and screen-blur models, checksummed; built on 22.04 like the app)
        run: scripts/fetch_deps.sh && make -j"$(nproc)" all build/test-blur-core
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Screen blur, unit tests and declarations against the real headers
        run: |
          make test-blur
          make check-blur-abi BLUR_ABI_CFLAGS="$(pkg-config --cflags libpipewire-0.3 wayland-client)"
      - name: Screen blur on a real X server (Xvfb, the helper as bundled)
        run: |
          python3 linux/blur/test_x11.py
          python3 linux/blur/test_x11.py --compositor "xcompmgr -n"   # with a compositing manager
      - name: Screen blur overlay on Wayland (sway headless, wlr-layer-shell)
        run: python3 linux/blur/test_layer_shell.py
      - name: Build
        working-directory: desktop
        run: flutter build linux --release
      - name: Engine and licence texts into the bundle
        run: bash -n linux/bin/islamic-mute && bash desktop/tool/bundle_engine.sh desktop/build/linux/x64/release/bundle
      # A tarball keeps the executable bits and symlinks (a plain artifact upload loses them).
      - name: Package
        run: tar czf waaiya-desktop-linux-x64.tar.gz -C desktop/build/linux/x64/release --transform 's,^bundle,waaiya,' bundle
      - uses: actions/upload-artifact@v4
        with:
          name: waaiya-desktop-linux-x64
          path: waaiya-desktop-linux-x64.tar.gz
          retention-days: 14

  # Windows cannot be built on Linux: this job is the Windows build check.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        working-directory: desktop
        run: flutter build windows --release
      - name: Licence texts next to the app
        shell: bash
        run: |
          d=desktop/build/windows/x64/runner/Release/licences; mkdir -p "$d"
          cp NOTICE "$d/NOTICE.txt"; cp LICENSE "$d/LICENSE-AGPL-3.0.txt"; cp THIRD_PARTY_LICENSES.md "$d/THIRD_PARTY_LICENSES.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: waaiya-desktop-windows-x64
          path: desktop/build/windows/x64/runner/Release
          retention-days: 14
